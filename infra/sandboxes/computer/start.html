<!doctype html>
<meta charset="utf-8">
<title>New tab</title>
<style>
  html, body { margin: 0; height: 100%; }
  body {
    font: 15px/1.5 Inter, "DejaVu Sans", sans-serif; color: #F2F2F2;
    background: #141414 url(wallpaper-night.png) center / cover no-repeat;
  }
  @media (prefers-color-scheme: light) {
    body { color: #141414; background-image: url(wallpaper-day.png); background-color: #F2F2F3; }
    p { color: rgba(0, 0, 0, .5) !important; }
  }
  main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; }
  h1 { font-size: 30px; font-weight: 600; letter-spacing: -0.6px; margin: 0 0 6px; }
  p { margin: 0; color: rgba(255, 255, 255, .55); }
</style>
<main>
  <div>
    <h1 id="hello">Good day</h1>
    <p>Pages show up here as they open.</p>
  </div>
</main>
<script>
  const h = new Date().getHours();
  document.getElementById("hello").textContent = h < 12 ? "Good morning" : h < 18 ? "Good afternoon" : "Good evening";
</script>
