name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gbot
          POSTGRES_PASSWORD: gbot-local
          POSTGRES_DB: gbot
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U gbot -d gbot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test
        working-directory: server
        run: go test -race ./...

  web:
    name: Web and characters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.13.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @gbot/web typecheck
      - name: Characters
        run: pnpm --filter @gbot/characters test
      - name: Build the web app
        run: pnpm --filter @gbot/web build

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
      - name: Accept the Android licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install the Android SDK
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
