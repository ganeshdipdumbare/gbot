name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gbot
          POSTGRES_PASSWORD: gbot-local
          POSTGRES_DB: gbot
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U gbot -d gbot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test
        working-directory: server
        run: go test -race ./...

  web:
    name: Web and characters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @gbot/web typecheck
      - name: Characters
        run: pnpm --filter @gbot/characters test
      - name: Build the web app
        run: pnpm --filter @gbot/web build

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Accept the Android licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install the Android SDK
        run: sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        working-directory: apps/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      # The release APK is signed with the committed debug key, so every run
      # leaves behind an APK that can be sideloaded straight onto a phone.
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: gbot-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Release the APK
    needs: android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gbot-apk
      - name: Attach it to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv app-release.apk "gbot-$TAG.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "gbot-$TAG.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "gbot-$TAG.apk" --repo "$GITHUB_REPOSITORY" --title "gbot $TAG" --generate-notes
          fi
