name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs. A tag or branch can be
# moved to new code; a SHA cannot. Update the SHA and the comment together.
jobs:
  server:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gbot
          POSTGRES_PASSWORD: gbot-local
          POSTGRES_DB: gbot
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U gbot -d gbot"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test
        working-directory: server
        run: go test -race ./...

  web:
    name: Web and characters
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @gbot/web typecheck
      - name: Characters
        run: pnpm --filter @gbot/characters test
      - name: Build the web app
        run: pnpm --filter @gbot/web build

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Accept the Android licenses
        run: yes | sdkmanager --licenses > /dev/null
      - name: Install the Android SDK
        run: sdkmanager --install "platforms;android-37.1" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # Tagged releases must be signed with the release key, which lives only
      # in the repository secrets. The key and passwords are scoped to the one
      # build step below (not exported to later steps), and the decoded key is
      # removed again afterwards. A tag without the secrets fails here.
      - name: Test and build
        working-directory: apps/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::Release signing secrets are missing; refusing to publish an unsigned or debug-signed APK."
              exit 1
            fi
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            export GBOT_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
            export GBOT_RELEASE_STORE_PASSWORD="$STORE_PASSWORD"
            export GBOT_RELEASE_KEY_ALIAS="$KEY_ALIAS"
            export GBOT_RELEASE_KEY_PASSWORD="$KEY_PASSWORD"
          fi
          ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Remove the release signing key
        if: always() && startsWith(github.ref, 'refs/tags/v')
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # Only tagged builds keep their APK, and only one signed with the
      # release key reaches the release job.
      - name: Keep the signed APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gbot-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  desktop:
    name: Mac app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the Mac app
        run: pnpm --filter @gbot/desktop build
      - name: Keep the Mac app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gbot-mac
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    name: Publish the artifacts
    needs: [android, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gbot-apk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gbot-mac
      # Each release carries a versioned copy and a fixed-name copy. The
      # fixed names are what the website links to through
      # releases/latest/download, so they never change.
      - name: Attach them to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mv app-release.apk gbot.apk
          mv *.dmg gbot-mac.dmg
          cp gbot.apk "gbot-$TAG.apk"
          cp gbot-mac.dmg "gbot-mac-$TAG.dmg"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" gbot.apk gbot-mac.dmg "gbot-$TAG.apk" "gbot-mac-$TAG.dmg" --repo "$REPO" --clobber
          else
            gh release create "$TAG" gbot.apk gbot-mac.dmg "gbot-$TAG.apk" "gbot-mac-$TAG.dmg" --repo "$REPO" --title "gbot $TAG" --generate-notes --latest
          fi
