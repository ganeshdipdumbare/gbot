plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.plugin.compose"
    id "org.jetbrains.kotlin.plugin.serialization"
}

android {
    namespace "dev.gbot.app"
    compileSdk 37

    defaultConfig {
        // Same id and key as the earlier apps, so this installs over them.
        applicationId "dev.gbot.app"
        minSdk 26
        targetSdk 36
        versionCode 4
        versionName "3.1"
    }

    signingConfigs {
        // Android's standard debug key: fine for sideloading, not for a store.
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // The real release key is never committed. CI supplies it through
        // these variables on tagged releases (see .github/workflows/ci.yml).
        if (System.getenv("GBOT_RELEASE_KEYSTORE")) {
            release {
                storeFile file(System.getenv("GBOT_RELEASE_KEYSTORE"))
                storePassword System.getenv("GBOT_RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("GBOT_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("GBOT_RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            // Local builds without the release key fall back to the debug key.
            // CI refuses to publish a debug-signed APK; see the android job.
            signingConfig signingConfigs.findByName("release") ?: signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all { it.systemProperty("robolectric.graphicsMode", "NATIVE"); it.maxHeapSize = "2g" }
        }
    }

    packaging {
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}", "/META-INF/*.kotlin_module", "DebugProbesKt.bin", "kotlin-tooling-metadata.json"]
        }
    }
}

dependencies {
    def bom = platform("androidx.compose:compose-bom:2026.09.00")
    implementation bom
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.foundation:foundation"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material:material-icons-core"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.navigation:navigation-compose:2.10.2"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.11.0"
    implementation "androidx.lifecycle:lifecycle-process:2.11.0"
    implementation "androidx.core:core-ktx:1.19.1"
    implementation "androidx.browser:browser:1.10.0"
    implementation "com.squareup.okhttp3:okhttp:5.5.1"
    implementation "com.squareup.okhttp3:okhttp-sse:5.5.1"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    // Runs the model on the phone; Kotlin API, GPU/CPU backends.
    implementation "com.google.ai.edge.litertlm:litertlm-android:0.19.1"
    implementation "org.commonmark:commonmark:0.32.0"
    implementation "org.commonmark:commonmark-ext-gfm-tables:0.32.0"
    implementation "org.commonmark:commonmark-ext-gfm-strikethrough:0.32.0"
    debugImplementation "androidx.compose.ui:ui-tooling"
    testImplementation "junit:junit:4.13.2"
    // Screen renders in the JVM (Robolectric), against a fake server.
    testImplementation bom
    testImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    testImplementation "org.robolectric:robolectric:4.17"
    testImplementation "androidx.test:core:1.7.0"
    testImplementation "androidx.test.ext:junit:1.3.0"
    testImplementation "com.squareup.okhttp3:mockwebserver3:5.5.1"
}
